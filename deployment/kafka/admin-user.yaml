# SCRAM-SHA-512 admin user. The password is read from the Secret `kafka-admin-password` (key `password`),
# which is NOT stored in git. Create it first:
#   kubectl -n strimzi-kraft-test create secret generic kafka-admin-password \
#     --from-literal=password="$(openssl rand -base64 24)"
# The name `admin` is listed in spec.kafka.authorization.superUsers in kafka-cluster.yaml.
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: admin
  namespace: strimzi-kraft-test
  labels:
    strimzi.io/cluster: kafkadev
spec:
  authentication:
    type: scram-sha-512
    password:
      valueFrom:
        secretKeyRef:
          name: kafka-admin-password
          key: password
